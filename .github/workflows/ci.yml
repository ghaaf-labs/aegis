name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Commit-message lint (PRs only) ───────────────────────────────────────
  commitlint:
    name: Commit messages (conventional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  # ── Branch name (conventional) ───────────────────────────────────────────
  branch-name:
    name: Branch name (conventional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-branch-name.sh
        env:
          GIT_BRANCH_OVERRIDE: ${{ github.head_ref }}

  # ── Frontend ─────────────────────────────────────────────────────────────
  web:
    name: Web (lint + type-check + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegis/web lint
      - run: pnpm --filter @aegis/web type-check
      - run: pnpm --filter @aegis/web test
      - run: pnpm --filter @aegis/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # ── Frontend e2e (Playwright, advisory while specs stabilize) ───────────
  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegis/web exec playwright install --with-deps chromium
      - run: pnpm --filter @aegis/web exec playwright test --reporter=line
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  # ── Frontend coverage (advisory, non-blocking) ───────────────────────────
  web-coverage:
    name: Web coverage (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegis/web test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 14

  # ── Format (prettier) ────────────────────────────────────────────────────
  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # ── Unused TS code (advisory) ────────────────────────────────────────────
  knip:
    name: Unused TS exports / files (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx knip

  # ── Typos (spelling) ─────────────────────────────────────────────────────
  typos:
    name: Typos (source + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  # ── Backend ──────────────────────────────────────────────────────────────
  api:
    name: API (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  # ── API coverage (cargo-llvm-cov, advisory) ──────────────────────────────
  api-coverage:
    name: API coverage (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - run: cargo llvm-cov --all-targets --workspace --lcov --output-path lcov.info --summary-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/lcov.info
          retention-days: 14

  # ── Dependency hygiene (audit + deny + machete) ──────────────────────────
  audit:
    name: API (audit + deny + machete)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny
        run: cargo deny check
      - name: Install cargo-machete
        run: cargo install --locked cargo-machete
      - name: cargo machete (unused deps)
        run: cargo machete

  # ── Docker ───────────────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: infra/docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
