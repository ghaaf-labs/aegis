# Deployment compose for Hetzner.
# Set APP_DOMAIN to override the default host (e.g. APP_DOMAIN=aegis.ghaaf.org).
# nginx on the host handles TLS — no Caddy needed.
# API on 127.0.0.1:8090, web on 127.0.0.1:3002.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      args:
        API_CARGO_FEATURES: ${API_CARGO_FEATURES:-real-cctp real-usyc}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      API_HOST: 0.0.0.0
      API_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?}
      DIGEST_SECRET: ${DIGEST_SECRET:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      MODEL_REGIME: anthropic/claude-haiku-4-5
      MODEL_STRATEGIST: anthropic/claude-opus-4-7
      MODEL_CRITIC: openai/gpt-5
      MODEL_TAX: anthropic/claude-sonnet-4-6
      MODEL_COMMENTARY: google/gemini-2.5-flash
      MOCK_CIRCLE: ${MOCK_CIRCLE:-true}
      CIRCLE_API_KEY: ${CIRCLE_API_KEY:-}
      CIRCLE_BASE_URL: https://api.circle.com
      EXECUTION_MOCK: ${EXECUTION_MOCK:-true}
      CORS_ALLOW_ORIGIN: https://${APP_DOMAIN:-aegis.devberlin.de}
      SESSION_COOKIE_NAME: __Host-aegis_session
      SESSION_COOKIE_SECURE: "true"
      PUBLIC_BASE_URL: https://${APP_DOMAIN:-aegis.devberlin.de}
      API_BASE_URL: https://${APP_DOMAIN:-aegis.devberlin.de}/api
      SCHEDULER_TICK_SECS: 300
      SCHEDULER_COOLDOWN_SECS: 1800
      DIGEST_HOUR_UTC: 13
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DIGEST_FROM: ${DIGEST_FROM:-Aegis <noreply@aegis.devberlin.de>}
    ports:
      - "127.0.0.1:8090:8080"
    sysctls:
      # The Hetzner host resolves external hostnames (e.g. api.resend.com) to
      # IPv6 via Tailscale DNS. Docker containers on the default bridge have no
      # IPv6 route to the internet, so TCP connects to those AAAA addresses hang
      # until the kernel TCP timeout fires (>>60 s), triggering the nginx 504.
      # Disabling IPv6 in the container's network namespace forces the system
      # resolver to return only A records, restoring sub-second connect times.
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:-aegis.devberlin.de}/api
        NEXT_PUBLIC_SSE_URL: https://${APP_DOMAIN:-aegis.devberlin.de}/api/sse
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:-aegis.devberlin.de}
        NEXT_PUBLIC_SERVER_API_URL: http://api:8080
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  postgres_data:
