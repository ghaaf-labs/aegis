apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-web
  labels: { app: aegis-web }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: aegis-web }
  template:
    metadata:
      labels: { app: aegis-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/mohijalili/aegis-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          # The Next.js build bakes NEXT_PUBLIC_* into the bundle, so these
          # must be set at *build* time, not here. See infra/docker/Dockerfile.web.
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-web
  labels: { app: aegis-web }
spec:
  selector: { app: aegis-web }
  ports:
    - port: 3000
      targetPort: 3000
      name: http
