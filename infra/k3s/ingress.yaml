# Traefik (k3s default) ingress with TLS via cert-manager.
# Replace `aegis.example.com` with your domain; install cert-manager separately.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: ops@aegis.app
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [aegis.example.com]
      secretName: aegis-tls
  rules:
    - host: aegis.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aegis-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegis-web
                port:
                  number: 3000
