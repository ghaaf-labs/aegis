[package]
name = "aegis-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "aegis-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database — `default-features = false` drops `any`. The `macros` feature is
# required for `#[derive(FromRow)]`. sqlx-macros-core 0.8.6 declares
# sqlx-{postgres,mysql,sqlite} as non-optional deps so all three appear in
# Cargo.lock — none are actually compiled into the binary, but they cause
# cargo-audit to flag RUSTSEC-2023-0071 (rsa via sqlx-mysql). Suppressed in
# deny.toml + audit.toml with the rationale that the affected code path
# is not reachable from this binary.
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
  "chrono",
  "json",
  "macros",
  "migrate",
  "rust_decimal",
] }

# Auth
jsonwebtoken = "9"
async-trait = "0.1"

# HTTP client (OpenAI, market data)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde_urlencoded = "0.7.1"

# Crypto utils used by the digest unsubscribe token + CCTP hook hashing.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"

# Concurrency primitives used by the proactive scheduler.
dashmap = "6"
tokio-util = { version = "0.7", features = ["rt"] }

# Money math for the AUM-fee streamer (Decimal — no f64 rounding drift).
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# HTML rendering for the daily digest.
handlebars = "6"

# Share-token generation: 32 random bytes → base64-url.
rand = "0.8"
base64 = "0.22"

# Alloy for real CCTP V2 + Hook execution (Phase 2).
# Gated behind the "real-cctp" feature. Default build stays fast.
# cargo build --features real-cctp
alloy = { version = "0.5", features = ["contract", "json", "node-bindings", "signer-local", "sol-types"], optional = true }

[features]
default = []
real-cctp = ["dep:alloy"]

[dev-dependencies]
tokio-test = "0.4"
