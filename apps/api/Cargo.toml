[package]
name = "aegis-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
# Several maintenance binaries live under src/bin/, so a bare `cargo run` is
# otherwise ambiguous. Default it to the server so `cargo run` (and the dev
# supervisor) always start the API.
default-run = "aegis-api"

[[bin]]
name = "aegis-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
once_cell = "1"

# Database — Postgres only. The local facade wraps sqlx-core/sqlx-postgres so
# MySQL/SQLite driver crates never enter Cargo.lock.
sqlx = { version = "0.9.0-aegis.1", path = "crates/sqlx-pg" }

# The pure n→m liquidity-routing engine (typed graph, convex cost model,
# min-cost-flow solver, leg DAG). apps/api owns no graph/solver logic of its own;
# it adapts ChainKey/TokenSpec/Config into this crate and reads routes back.
aegis-routing = { path = "../../crates/aegis-routing" }

# Auth
async-trait = "0.1"

# HTTP client (OpenAI, market data)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utils
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

# Crypto utils used by the digest unsubscribe token + CCTP hook hashing.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"

# Concurrency primitives used by the proactive scheduler.
dashmap = "6"
tokio-util = { version = "0.7", features = ["rt"] }

# Money math for the AUM-fee streamer (Decimal — no f64 rounding drift).
rust_decimal = { version = "1", features = ["serde-with-str", "serde-with-float"] }
rust_decimal_macros = "1"

# HTML rendering for the daily digest.
handlebars = "6"

# Share-token generation: 32 random bytes → base64-url.
rand = "0.8"
base64 = "0.22"

# Circle developer-controlled wallets require a fresh entity-secret ciphertext
# on each sensitive request. The ciphertext is RSA-OAEP(SHA-256) over the
# hex-encoded entity secret using Circle's entity public key.
rsa = "0.9"

# Alloy for real CCTP V2 + Hook execution (Phase 2).
# Gated behind the "real-cctp" feature. Default build stays fast.
# cargo build --features real-cctp
alloy = { version = "2.0.5", features = ["contract", "json", "node-bindings", "signer-local", "sol-types"], optional = true }

[features]
default = ["real-cctp", "real-usyc", "real-swap"]
real-cctp = ["dep:alloy"]
real-usyc = ["dep:alloy"]
# Compile the real per-chain swap adapter (Uniswap V3 QuoterV2 + SwapRouter02
# on Base Sepolia). Without it, USDC↔token swaps fail closed.
real-swap = ["dep:alloy"]

[dev-dependencies]
tokio-test = "0.4"

# ── Lints ─────────────────────────────────────────────────────────────────────
# Ratchet pattern: the pedantic + nursery groups are guard-rails for NEW code.
# The lints already firing across the existing tree (measured 2026-05-23, 34k LOC)
# are allowed back so `cargo clippy --all-targets -- -D warnings` (CI) stays green —
# we don't refactor the whole tree to satisfy stylistic lints. To raise the bar,
# delete an allow-back and fix the sites it flags. See docs/15-quality-bar.md.
# `clippy::cargo` is omitted on purpose: dep hygiene is covered by cargo-deny +
# cargo-machete in CI, and its `multiple_crate_versions` is unfixable here.
[lints.rust]
unsafe_code = "forbid"        # the API has zero unsafe; chain crates live behind cargo features

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
# allow-backs — pedantic/nursery lints that currently fire (alphabetical):
branches_sharing_code = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
derive_partial_eq_without_eq = "allow"
doc_markdown = "allow"
duration_suboptimal_units = "allow"
elidable_lifetime_names = "allow"
explicit_iter_loop = "allow"
float_cmp = "allow"
format_push_string = "allow"
if_not_else = "allow"
ignore_without_reason = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_collect = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
ptr_as_ptr = "allow"
redundant_clone = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
tuple_array_conversions = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unreadable_literal = "allow"
unused_async = "allow"
use_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
