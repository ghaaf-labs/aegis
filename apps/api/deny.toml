# cargo-deny configuration — runs in CI to gate dependency hygiene.
#
# Run locally:
#   cargo install --locked cargo-deny
#   cargo deny --manifest-path apps/api/Cargo.toml check

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# RUSTSEC-2023-0071 (rsa Marvin Attack). Circle developer-controlled wallets
# require RSA-OAEP(SHA-256) public-key encryption for the entity-secret
# ciphertext. Aegis never stores an RSA private key or performs RSA decrypt,
# so the Marvin private-key timing sidechannel is not reachable in this use.
# Re-evaluate when the rsa crate ships a fixed release or Circle documents a
# non-RSA envelope for entity-secret ciphertext.
ignore = [
    "RUSTSEC-2023-0071",
    # RUSTSEC-2024-0436 (paste unmaintained). `paste` is a compile-time
    # proc-macro pulled in transitively by alloy (alloy-primitives); it has no
    # runtime or security surface and there is no maintained drop-in wired
    # through alloy yet. Re-evaluate when alloy drops the dependency.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = [
    # Known-unmaintained or deprecated crates we never want pulled in.
    { name = "openssl-sys" }, # we use rustls
]
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Linux Foundation permissive license — used by webpki-roots and some
    # other CA-bundle crates.
    "CDLA-Permissive-2.0",
    "OpenSSL", # transitive ring dep; we don't link openssl ourselves
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
