# cargo-deny configuration — runs in CI to gate dependency hygiene.
#
# Run locally:
#   cargo install --locked cargo-deny
#   cargo deny --manifest-path apps/api/Cargo.toml check

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# RUSTSEC-2023-0071 (rsa Marvin Attack) — pulled in transitively via
# sqlx-mysql, which is a non-optional dep of sqlx-macros-core 0.8.6 (so
# `default-features = false` alone cannot eliminate it from Cargo.lock).
# We do not enable the `mysql` feature on sqlx, so sqlx-mysql + rsa are
# present in the lockfile but never compiled into the binary or executed
# at runtime. Re-evaluate when sqlx ships a release that fixes the
# unconditional macros-core dep on every backend.
ignore = ["RUSTSEC-2023-0071"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = [
    # Known-unmaintained or deprecated crates we never want pulled in.
    { name = "openssl-sys" }, # we use rustls
]
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Linux Foundation permissive license — used by webpki-roots and some
    # other CA-bundle crates.
    "CDLA-Permissive-2.0",
    "OpenSSL", # transitive ring dep; we don't link openssl ourselves
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
